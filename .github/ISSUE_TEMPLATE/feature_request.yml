name: Feature or new tool
description: Suggest an improvement to a tool, or a new tool for the repo.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - Improvement to an existing tool
        - New tool
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool (if existing)
      placeholder: dev-context-mcp
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, painful or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
