name: Bug report
description: Something in a tool does not work as documented.
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      placeholder: dev-context-mcp 3.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and client
      description: For example the Node.js version and the AI assistant or MCP client you use.
      placeholder: Node 22.11, Claude Code
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Call ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove tokens, keys and personal paths before pasting.
      render: text
