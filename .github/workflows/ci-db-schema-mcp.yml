name: db-schema-mcp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/db-schema-mcp/**"
      - ".github/workflows/ci-db-schema-mcp.yml"
      - ".github/workflows/node-tool.yml"
  pull_request:
    paths:
      - "tools/db-schema-mcp/**"
      - ".github/workflows/ci-db-schema-mcp.yml"
      - ".github/workflows/node-tool.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests on every OS (integration tests skip without database URLs).
  ci:
    uses: ./.github/workflows/node-tool.yml
    with:
      tool: db-schema-mcp

  # Integration tests against real databases. Service containers are Linux-only.
  integration:
    name: integration / Postgres 17 + MySQL 8.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: tools/db-schema-mcp
    env:
      TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/db-schema-mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (unit + integration)
        run: npm test
