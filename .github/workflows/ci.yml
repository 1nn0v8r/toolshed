# One CI workflow for every tool. It runs on every push and pull request (so the
# "ci" status always reports), but only tests the tools whose folders changed.
#
# Runners:
#   Linux tests run on the self-hosted runner labelled "toolshed".
#   Windows and macOS tests run on GitHub-hosted runners.
#   Database integration tests run on GitHub-hosted Ubuntu (they need service containers).
#
# Security: self-hosted jobs run whatever code a workflow runs, so they skip pull
# requests from forks. Only pushes and pull requests from branches in this
# repository reach the self-hosted runner.

name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List tools to test
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          all=$(ls -d tools/*/ | xargs -n1 basename | sort)
          # Run everything for manual runs, and when shared CI changes.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            changed="$all"
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "__all__")
            if printf '%s\n' "$files" | grep -qE '^(\.github/workflows/ci\.yml|__all__)$'; then
              changed="$all"
            else
              changed=$(printf '%s\n' "$files" | grep -E '^tools/[^/]+/' | cut -d/ -f2 | sort -u || true)
            fi
          fi
          json=$(printf '%s\n' $changed | grep -v '^$' | jq -R . | jq -sc . 2>/dev/null || echo '[]')
          [ -z "$json" ] && json='[]'
          echo "tools=$json" >> "$GITHUB_OUTPUT"
          echo "Testing: $json"

  test-linux:
    name: ${{ matrix.tool }} / self-hosted Linux / Node ${{ matrix.node }}
    needs: changes
    if: >-
      needs.changes.outputs.tools != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, toolshed]
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
        node: ["20", "22"]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  test-hosted:
    name: ${{ matrix.tool }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.tools != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.changes.outputs.tools) }}
        os: [windows-latest, macos-latest]
        node: ["20", "22"]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  integration:
    name: db-schema-mcp integration
    needs: changes
    if: >-
      contains(needs.changes.outputs.tools, 'db-schema-mcp') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: tools/db-schema-mcp
    env:
      TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  # The single required check for tool tests. It passes when nothing changed
  # or when every test job succeeded, and fails otherwise.
  ci:
    name: ci
    needs: [changes, test-linux, test-hosted, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          R_LINUX: ${{ needs.test-linux.result }}
          R_HOSTED: ${{ needs.test-hosted.result }}
          R_INT: ${{ needs.integration.result }}
          TOOLS: ${{ needs.changes.outputs.tools }}
        run: |
          echo "tools: $TOOLS"
          echo "linux: $R_LINUX, hosted: $R_HOSTED, integration: $R_INT"
          if [ "$TOOLS" = "[]" ]; then exit 0; fi
          for r in "$R_LINUX" "$R_HOSTED" "$R_INT"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
