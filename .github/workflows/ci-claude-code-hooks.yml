name: claude-code-hooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/claude-code-hooks/**"
      - ".github/workflows/ci-claude-code-hooks.yml"
      - ".github/workflows/node-tool.yml"
  pull_request:
    paths:
      - "tools/claude-code-hooks/**"
      - ".github/workflows/ci-claude-code-hooks.yml"
      - ".github/workflows/node-tool.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/node-tool.yml
    with:
      tool: claude-code-hooks
