# Reusable CI for a Node.js tool in tools/<name>.
# Each tool has a small caller workflow (ci-<name>.yml) with its own path filters.
# Every tool must define the npm scripts "typecheck" and "test".

name: node-tool

on:
  workflow_call:
    inputs:
      tool:
        description: Folder name under tools/
        required: true
        type: string
      node-versions:
        description: JSON array of Node.js versions
        required: false
        type: string
        default: '["20", "22"]'
      os:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.tool }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: tools/${{ inputs.tool }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/${{ inputs.tool }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
