<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">The tools in toolshed</title>
  <desc id="desc">Ten tools in three groups. MCP servers: dev-context-mcp, git-history-mcp, test-report-mcp and db-schema-mcp. CLIs: repo-pack, token-count, env-check and changelog-gen. Hooks and automation: commit-guard and claude-code-hooks.</desc>
  <defs>
    <style>
      .h { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .name { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .desc { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="24" fill="#0f172a"/>

  <!-- Column: MCP servers -->
  <g transform="translate(40 40)">
    <rect width="384" height="480" rx="18" fill="#111c33" stroke="#1e3a5f" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="8" fill="#3b82f6"/>
    <text class="h" x="52" y="46" fill="#bfdbfe">MCP servers</text>

    <g transform="translate(20 72)">
      <rect width="344" height="90" rx="12" fill="#16233f"/>
      <text class="name" x="18" y="34">dev-context-mcp</text>
      <text class="desc" x="18" y="60">Token-capped search, reads, edits,</text>
      <text class="desc" x="18" y="80">git, quality checks and web</text>
    </g>
    <g transform="translate(20 172)">
      <rect width="344" height="90" rx="12" fill="#16233f"/>
      <text class="name" x="18" y="34">git-history-mcp</text>
      <text class="desc" x="18" y="60">Why the code looks this way: history,</text>
      <text class="desc" x="18" y="80">grouped blame, line origin, churn</text>
    </g>
    <g transform="translate(20 272)">
      <rect width="344" height="90" rx="12" fill="#16233f"/>
      <text class="name" x="18" y="34">test-report-mcp</text>
      <text class="desc" x="18" y="60">Runs your tests and returns only</text>
      <text class="desc" x="18" y="80">the failures, with file and line</text>
    </g>
    <g transform="translate(20 372)">
      <rect width="344" height="90" rx="12" fill="#16233f"/>
      <text class="name" x="18" y="34">db-schema-mcp</text>
      <text class="desc" x="18" y="60">Read-only Postgres and MySQL</text>
      <text class="desc" x="18" y="80">schemas and guarded SELECTs</text>
    </g>
  </g>

  <!-- Column: CLIs -->
  <g transform="translate(448 40)">
    <rect width="384" height="480" rx="18" fill="#1a160f" stroke="#5c4310" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="8" fill="#f59e0b"/>
    <text class="h" x="52" y="46" fill="#fde68a">CLIs</text>

    <g transform="translate(20 72)">
      <rect width="344" height="90" rx="12" fill="#2a2213"/>
      <text class="name" x="18" y="34">repo-pack</text>
      <text class="desc" x="18" y="60">Bundles project files into one</text>
      <text class="desc" x="18" y="80">prompt-ready file within a budget</text>
    </g>
    <g transform="translate(20 172)">
      <rect width="344" height="90" rx="12" fill="#2a2213"/>
      <text class="name" x="18" y="34">token-count</text>
      <text class="desc" x="18" y="60">Estimates the token cost of files</text>
      <text class="desc" x="18" y="80">before you paste them anywhere</text>
    </g>
    <g transform="translate(20 272)">
      <rect width="344" height="90" rx="12" fill="#2a2213"/>
      <text class="name" x="18" y="34">env-check</text>
      <text class="desc" x="18" y="60">Finds env vars your code reads</text>
      <text class="desc" x="18" y="80">that .env.example does not document</text>
    </g>
    <g transform="translate(20 372)">
      <rect width="344" height="90" rx="12" fill="#2a2213"/>
      <text class="name" x="18" y="34">changelog-gen</text>
      <text class="desc" x="18" y="60">Keep a Changelog entries from</text>
      <text class="desc" x="18" y="80">commits, with per-tool tags</text>
    </g>
  </g>

  <!-- Column: Hooks and automation -->
  <g transform="translate(856 40)">
    <rect width="384" height="480" rx="18" fill="#0f1d17" stroke="#1d4d33" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="8" fill="#22c55e"/>
    <text class="h" x="52" y="46" fill="#bbf7d0">Hooks and automation</text>

    <g transform="translate(20 72)">
      <rect width="344" height="90" rx="12" fill="#14291f"/>
      <text class="name" x="18" y="34">commit-guard</text>
      <text class="desc" x="18" y="60">Pre-commit hook that blocks secrets,</text>
      <text class="desc" x="18" y="80">personal paths and .env files</text>
    </g>
    <g transform="translate(20 172)">
      <rect width="344" height="90" rx="12" fill="#14291f"/>
      <text class="name" x="18" y="34">claude-code-hooks</text>
      <text class="desc" x="18" y="60">Blocks secret files, leaked keys and</text>
      <text class="desc" x="18" y="80">risky commands; formats edits</text>
    </g>

    <!-- Shared infrastructure note -->
    <g transform="translate(20 290)">
      <text class="desc" x="0" y="0" fill="#94a3b8">Every tool:</text>
      <g class="desc">
        <circle cx="6" cy="27" r="3" fill="#22c55e"/>
        <text x="18" y="32">Windows, macOS and Linux</text>
        <circle cx="6" cy="57" r="3" fill="#22c55e"/>
        <text x="18" y="62">Tested in CI on Node 20 and 22</text>
        <circle cx="6" cy="87" r="3" fill="#22c55e"/>
        <text x="18" y="92">Own README, changelog, version</text>
        <circle cx="6" cy="117" r="3" fill="#22c55e"/>
        <text x="18" y="122">MIT licensed</text>
      </g>
    </g>
  </g>
</svg>
