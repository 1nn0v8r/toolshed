# Full toolshed Docker stack:
#   - toolshed-ui:     Visual Web UI installer & dashboard on http://127.0.0.1:4317
#   - dev-context-mcp: Unified MCP server (HTTP) on http://127.0.0.1:4318/mcp
#
# Quick start:
#   docker compose up -d --build
#
# Override the MCP bearer token in production:
#   MCP_AUTH_TOKEN=your-secret-token docker compose up -d

services:
  toolshed-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toolshed-ui
    command: ["node", "bin/toolshed.js", "ui", "--host", "0.0.0.0", "--port", "4317", "--no-open"]
    environment:
      TOOLSHED_UI_HOST: 0.0.0.0
      TOOLSHED_UI_PORT: "4317"
    ports:
      - "127.0.0.1:${TOOLSHED_UI_PORT:-4317}:4317"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dev-context-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toolshed-mcp
    command: ["node", "tools/dev-context-mcp/dist/server.js", "--http"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-toolshed-local-dev-token}
      MCP_MODULES: ${MCP_MODULES:-core,git-history,diagnostics,test-report,web}
      REPO_ROOT: /workspace
      MCP_ROOT_BASE: /workspace
    volumes:
      - ${WORKSPACE:-.}:/workspace:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-4318}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
